services:
  postgres:
    image: postgres:16-alpine
    container_name: urb-tectrack-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tectrack
      POSTGRES_PASSWORD: tectrack_dev
      POSTGRES_DB: tectrack
    volumes:
      - tectrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tectrack -d tectrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tectrack_pgdata:

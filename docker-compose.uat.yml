name: urb-tectrack-uat

services:
  db:
    image: postgres:16-alpine
    container_name: urb-tectrack-uat-db
    environment:
      POSTGRES_USER: tectrack
      POSTGRES_PASSWORD: tectrack_uat
      POSTGRES_DB: tectrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tectrack -d tectrack"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - uat-pg:/var/lib/postgresql/data

  app:
    container_name: urb-tectrack-uat-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3001"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: tectrack
      DATABASE_PASSWORD: tectrack_uat
      DATABASE_NAME: tectrack
      SESSION_SECRET: "urb-tectrack-uat-session-secret-change-for-staging"
      UAT_SEED: "true"
      COOKIE_SECURE: "false"
      EMAIL_PROVIDER: console
      PORTAL_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080
      ENABLE_JOBS: "true"
    depends_on:
      db:
        condition: service_healthy

  # Automated daily pg_dump backup — dumps to ./backups/uat/ on the host.
  # Keeps the last 7 days via find -mtime +7 -delete.
  db-backup:
    image: postgres:16-alpine
    container_name: urb-tectrack-uat-backup
    environment:
      PGPASSWORD: tectrack_uat
    volumes:
      - ./backups/uat:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "
        while true; do
          FILE=/backups/tectrack_$$(date +%Y%m%d_%H%M%S).sql.gz;
          pg_dump -h db -U tectrack tectrack | gzip > $$FILE;
          echo \"[backup] wrote $$FILE\";
          find /backups -name '*.sql.gz' -mtime +7 -delete;
          sleep 86400;
        done
      "
    restart: unless-stopped

volumes:
  uat-pg:
    name: urb-tectrack_uat-pg

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tectrack
          POSTGRES_PASSWORD: tectrack
          POSTGRES_DB: tectrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true

      - run: pnpm install

      - run: pnpm --filter @urb-tectrack/shared test
      - run: pnpm --filter @urb-tectrack/shared build
      - run: pnpm --filter @urb-tectrack/api lint
      - run: pnpm --filter @urb-tectrack/web lint
